# Single-node install: PostgreSQL + certloomd. See deploy/compose/README.md.
# Secrets come from .env (never commit it); copy .env.example and fill it in.
name: certloom

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: certloom_owner
      POSTGRES_PASSWORD: ${CERTLOOM_OWNER_DB_PASSWORD:?set CERTLOOM_OWNER_DB_PASSWORD in .env}
      POSTGRES_DB: certloom
    volumes:
      - pgdata:/var/lib/postgresql   # PG 18+ layout: data lives in a versioned subdirectory
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "certloom_owner", "-d", "certloom"]
      interval: 5s
      retries: 20
    # Not published to the host: only certloomd talks to the database.

  migrate:
    image: ${CERTLOOM_IMAGE:-certloom:dev}
    build: ../..
    command: ["migrate"]
    environment:
      CERTLOOM_MIGRATE_DATABASE_URL: postgres://certloom_owner:${CERTLOOM_OWNER_DB_PASSWORD}@db:5432/certloom?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Gives the runtime role a password. Runs after every migrate; idempotent.
  app-role:
    image: postgres:18-alpine
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -c \"ALTER ROLE certloom_app LOGIN PASSWORD '$$CERTLOOM_APP_DB_PASSWORD'\""]
    environment:
      PGHOST: db
      PGUSER: certloom_owner
      PGDATABASE: certloom
      PGPASSWORD: ${CERTLOOM_OWNER_DB_PASSWORD}
      CERTLOOM_APP_DB_PASSWORD: ${CERTLOOM_APP_DB_PASSWORD:?set CERTLOOM_APP_DB_PASSWORD in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  certloomd:
    image: ${CERTLOOM_IMAGE:-certloom:dev}
    build: ../..
    command: ["serve"]
    restart: unless-stopped
    environment:
      CERTLOOM_DATABASE_URL: postgres://certloom_app:${CERTLOOM_APP_DB_PASSWORD}@db:5432/certloom?sslmode=disable
      CERTLOOM_LISTEN: 0.0.0.0:8443
      CERTLOOM_TLS_CERT: /run/certloom/tls/server.crt
      CERTLOOM_TLS_KEY: /run/certloom/tls/server.key
      CERTLOOM_LOG_LEVEL: ${CERTLOOM_LOG_LEVEL:-info}
      # Key-encryption key: protects the agent CA, the task signing key and
      # stored credentials. Back it up apart from the database; a restore
      # needs both.
      CERTLOOM_KEK_FILE: /run/secrets/kek
      # Agent listener (mutual TLS). Agents dial out to it, so the name must
      # be the one agents use to reach this host.
      CERTLOOM_AGENT_LISTEN: 0.0.0.0:8444
      CERTLOOM_AGENT_SERVER_NAMES: ${CERTLOOM_HOSTNAME:?set CERTLOOM_HOSTNAME in .env}
      CERTLOOM_AGENT_PUBLIC_URL: https://${CERTLOOM_HOSTNAME}:8444
      CERTLOOM_WEBHOOK_SECRET: ${CERTLOOM_WEBHOOK_SECRET:-}
      CERTLOOM_SMTP_PASSWORD: ${CERTLOOM_SMTP_PASSWORD:-}
      # External audit export (ADR-0012). Strongly recommended; see the compose README.
      CERTLOOM_AUDIT_EXPORT: ${CERTLOOM_AUDIT_EXPORT:-}
      CERTLOOM_AUDIT_EXPORT_KEY_REF: ${CERTLOOM_AUDIT_EXPORT_KEY_REF:-}
      CERTLOOM_AUDIT_EXPORT_KEY: ${CERTLOOM_AUDIT_EXPORT_KEY:-}
      # Single sign-on (optional)
      CERTLOOM_OIDC_ISSUER: ${CERTLOOM_OIDC_ISSUER:-}
      CERTLOOM_OIDC_CLIENT_ID: ${CERTLOOM_OIDC_CLIENT_ID:-}
      CERTLOOM_OIDC_CLIENT_SECRET_REF: ${CERTLOOM_OIDC_CLIENT_SECRET_REF:-}
      CERTLOOM_OIDC_CLIENT_SECRET: ${CERTLOOM_OIDC_CLIENT_SECRET:-}
      CERTLOOM_OIDC_REDIRECT_URL: ${CERTLOOM_OIDC_REDIRECT_URL:-}
      CERTLOOM_OIDC_CLI_CLIENT_ID: ${CERTLOOM_OIDC_CLI_CLIENT_ID:-}
    secrets: [kek]
    volumes:
      - ./tls:/run/certloom/tls:ro
    ports:
      - "${CERTLOOM_PUBLISH:-127.0.0.1:8443}:8443"
      - "${CERTLOOM_AGENT_PUBLISH:-127.0.0.1:8444}:8444"
    depends_on:
      app-role: { condition: service_completed_successfully }

secrets:
  kek:
    file: ./secrets/kek

volumes:
  pgdata:
