# nfpm package definition for certloom-agent (deb and rpm).
#
# Build with deploy/packaging/build.sh, or by hand from the repository root
# after building the binary to dist/linux/certloom-agent (CGO_ENABLED=0 GOOS=linux):
#   docker run --rm -v "$PWD:/src" -w /src -e VERSION=1.2.3 -e GOARCH=amd64 \
#     goreleaser/nfpm:v2.44.0 pkg --config deploy/packaging/nfpm.yaml --packager deb --target dist/
#
# Relative paths are resolved from the working directory (the repository root).
name: certloom-agent
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: admin
priority: optional
maintainer: certloom maintainers <certloom@example.com>
description: |
  Certificate lifecycle agent for certloom.
  Runs next to a web server, obtains certificates over ACME with locally
  generated keys, deploys them with an atomic symlink switch, tests and
  reloads the server and verifies what it serves.
vendor: certloom
homepage: https://github.com/alexandrosnt/certloom
license: Apache-2.0

contents:
  - src: dist/linux/certloom-agent
    dst: /usr/bin/certloom-agent
    file_info:
      mode: 0755
  - src: deploy/systemd/certloom-agent.service
    dst: /usr/lib/systemd/system/certloom-agent.service
    file_info:
      mode: 0644
  - src: deploy/packaging/config.example.yaml
    dst: /etc/certloom-agent/config.yaml
    type: config|noreplace
    file_info:
      mode: 0640
  - dst: /etc/certloom-agent
    type: dir
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/certloom-agent/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: deploy/packaging/scripts/postinstall.sh
  preremove: deploy/packaging/scripts/preremove.sh
  postremove: deploy/packaging/scripts/postremove.sh
