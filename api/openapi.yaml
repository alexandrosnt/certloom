openapi: 3.0.3
info:
  title: certloom control plane API
  version: "1.0.0-m1"
  description: |
    Certificate lifecycle management API (ADR-0010). M1 scope: inventory and
    monitoring only.

    Conventions:
    - Authentication: `Authorization: Bearer <token>`. The token is an API token
      (`certloom_...`) or an OIDC session (`certlooms_...`).
    - Errors use RFC 9457 problem details (`application/problem+json`).
    - Every response carries `X-Request-Id`. The same id appears in audit events.
    - `POST` requests accept `Idempotency-Key`. A retry with the same key and an
      identical body replays the stored response (`Idempotent-Replayed: true`).
      The same key with a different request returns 422; a request still in
      progress returns 409. `POST /tokens` rejects the header, because its
      response contains a secret.
    - Mutable resources return an `ETag` header (`"v<version>"`). Send it back as
      `If-Match` on `PUT`; a stale value returns 412.
    - Rate limits are per principal (`RateLimit-Limit`, `RateLimit-Remaining`).
      Throttled requests return 429 with `Retry-After`. Limits apply per server
      process.
    - Lists return `{items: [...], next_cursor?: string}`.
  license:
    name: Apache-2.0
servers:
  - url: /
security:
  - bearer: []

tags:
  - name: system
  - name: auth
  - name: inventory
  - name: endpoints
  - name: ownership
  - name: alerts
  - name: admin
  - name: audit
  - name: agents
  - name: renewal
  - name: approvals

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      tags: [system]
      summary: Readiness (database reachable)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/config:
    get:
      tags: [auth]
      summary: Public sign-in options
      security: []
      responses:
        "200":
          description: Sign-in configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidc: { type: boolean }
                  issuer: { type: string }
                  cli_client_id: { type: string }
                  device_authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/oidc/session:
    post:
      tags: [auth]
      summary: Exchange a device-flow ID token for a session (CLI sign-in)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                org: { type: string, description: "Organization name, if the identity belongs to several" }
      responses:
        "201":
          description: Session created. The token is returned only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  org_id: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/session:
    delete:
      tags: [auth]
      summary: Revoke the current session (no-op for API tokens)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/whoami:
    get:
      tags: [auth]
      summary: The authenticated principal
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
                  actor: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  permissions: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/members:
    get:
      tags: [admin]
      summary: List single sign-on members (owner)
      responses:
        "200": { $ref: "#/components/responses/List" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      summary: Add a member by verified email (owner)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/members/{id}:
    delete:
      tags: [admin]
      summary: Remove a member and end their sessions (owner)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/overview:
    get:
      tags: [inventory]
      summary: Headline metrics, each with definition and denominator
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        value: { type: integer }
                        denominator: { type: integer }
                        definition: { type: string }
                        link: { type: string }
  /api/v1/certificates:
    get:
      tags: [inventory]
      summary: List certificates, soonest expiry first
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: expiring, in: query, description: "Horizon such as 30d; 0d = expired", schema: { type: string } }
        - { name: include_ca, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
                  next_cursor: { type: string }
  /api/v1/certificates/{fp}:
    get:
      tags: [inventory]
      summary: Certificate detail (full SHA-256 or a unique prefix of at least 8 characters)
      parameters:
        - { name: fp, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{8,64}$" } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/certificates/import:
    post:
      tags: [inventory]
      summary: Import PEM, DER or PKCS#12. Private keys are never stored.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, format: byte, description: Base64 file contents (<= 1 MiB) }
                password: { type: string, format: password, description: "PKCS#12 only; never logged or stored" }
                lineage: { type: string }
                team: { type: string }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [pem, der, pkcs12] }
                  imported: { type: array, items: { type: string } }
                  already_known: { type: array, items: { type: string } }
                  private_key_seen: { type: boolean }
                  key_matches_leaf: { type: boolean }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /api/v1/scopes:
    get:
      tags: [endpoints]
      summary: List probe scopes
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [endpoints]
      summary: Create a probe scope (owner). Overrides of denied address classes are audited.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                config:
                  type: object
                  properties:
                    allow_cidrs: { type: array, items: { type: string } }
                    allow_hosts: { type: array, items: { type: string } }
                    ports: { type: array, items: { type: integer } }
                    allow_loopback: { type: boolean }
                    allow_private: { type: boolean }
                    allow_link_local: { type: boolean }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/scopes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [endpoints]
      summary: Show a probe scope (id or name)
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [endpoints]
      summary: Change a probe scope; absent fields stay as they are
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string }, config: { type: object } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [endpoints]
      summary: Delete a probe scope nothing else references
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/endpoints:
    get:
      tags: [endpoints]
      summary: List endpoints
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [endpoints]
      summary: Add an endpoint (must be allowed by its scope)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, scope]
              properties:
                host: { type: string }
                port: { type: integer, default: 443 }
                sni: { type: string }
                scope: { type: string }
                lineage: { type: string }
                team: { type: string }
                interval_seconds: { type: integer, minimum: 60 }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/endpoints/{id}:
    get:
      tags: [endpoints]
      summary: Endpoint with recent observations and open findings
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Versioned" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [endpoints]
      summary: Change scope, team, lineage, interval or enabled; host, port and SNI are fixed
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: { type: string }
                team: { type: string, description: Team id or name; empty clears it }
                lineage: { type: string, description: Lineage id or name; empty clears it }
                interval_seconds: { type: integer, minimum: 60 }
                enabled: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Versioned" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [endpoints]
      summary: Delete an endpoint and its observations; open findings are resolved
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/endpoints/{id}/probe:
    post:
      tags: [endpoints]
      summary: Probe now
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/endpoints/{id}/lineage:
    put:
      tags: [ownership]
      summary: Bind the lineage the endpoint is expected to serve
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [lineage], properties: { lineage: { type: string } } }
      responses:
        "204": { description: Bound }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /api/v1/findings:
    get:
      tags: [inventory]
      summary: List findings
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [warning, critical] } }
        - { name: subject_type, in: query, schema: { type: string, enum: [certificate, endpoint, lineage] } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: check, in: query, schema: { type: string } }
        - { name: include_resolved, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/List" }

  /api/v1/teams:
    get:
      tags: [ownership]
      summary: List teams
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [ownership]
      summary: Create a team
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, contact: { type: string } } }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/teams/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [ownership]
      summary: Show a team (id or name)
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [ownership]
      summary: Change a team; absent fields stay as they are
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string }, contact: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [ownership]
      summary: Delete a team nothing else references
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/lineages:
    get:
      tags: [ownership]
      summary: List lineages
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [ownership]
      summary: Create a lineage
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                team: { type: string }
                current_sha256: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/lineages/{id}:
    get:
      tags: [ownership]
      summary: Lineage by id or name
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Versioned" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/lineages/{id}/owner:
    put:
      tags: [ownership]
      summary: Assign the owning team
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [team], properties: { team: { type: string } } }
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: List alerts
      parameters:
        - { name: state, in: query, description: "Comma-separated: open,acked,resolved,suppressed", schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/alerts/{id}/ack:
    post:
      tags: [alerts]
      summary: Acknowledge an open alert
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Acknowledged }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/channels:
    get:
      tags: [alerts]
      summary: List notification channels
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [alerts]
      summary: Create a webhook or email channel (owner). Secrets are passed as credential references.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, config]
              properties:
                name: { type: string }
                kind: { type: string, enum: [webhook, email] }
                config: { type: object }
                credential_ref: { type: string, example: "env:CERTLOOM_WEBHOOK_SECRET" }
                min_severity: { type: string, enum: [info, warning, critical] }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/channels/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [alerts]
      summary: Show a notification channel
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [alerts]
      summary: Change a notification channel; absent fields stay as they are
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string }, config: { type: object }, credential_ref: { type: string }, min_severity: { type: string, enum: [info, warning, critical] }, enabled: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [alerts]
      summary: Delete a notification channel nothing else references
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/channels/{id}/test:
    post:
      tags: [alerts]
      summary: Queue a test notification
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/tokens:
    get:
      tags: [admin]
      summary: List API tokens (metadata only)
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [admin]
      summary: Create a token. The secret is returned once. Idempotency-Key is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                ttl_seconds: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/tokens/{id}:
    delete:
      tags: [admin]
      summary: Revoke a token
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/automation/pause:
    post:
      tags: [admin]
      summary: Pause probing and sweeps for this organization (kill switch)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/automation/resume:
    post:
      tags: [admin]
      summary: Resume automation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/agents:
    get:
      tags: [agents]
      summary: List agents with derived health (active, stale, offline, revoked, never-seen)
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/agents/enrollment-tokens:
    post:
      tags: [agents]
      summary: Create a one-time agent enrollment token (owner; TTL <= 1h). Returns the CA hash to pin.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, ttl_seconds: { type: integer, maximum: 3600 } } }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/agents/{id}/revoke:
    post:
      tags: [agents]
      summary: Revoke an agent immediately; pending tasks expire (owner)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/agents/{id}/inventory:
    get:
      tags: [agents]
      summary: Last observations reported by the agent (IIS bindings, win-acme renewals, Certbot lineages, Kubernetes objects)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [agents]
      summary: Ask the agent to report certificate files, Certbot and win-acme renewals, IIS bindings or Kubernetes objects (read-only)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers:
    get:
      tags: [renewal]
      summary: List issuers (ACME, Vault PKI, step-ca); credentials are never returned
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [renewal]
      summary: >-
        Register an issuer (issuers:manage). ACME issuers need agree_tos true. Vault and step-ca issuers
        (ADR-0028) sign a CSR from the agent through the control plane and need ca_bundle, settings and a
        credential, which is encrypted with the KEK and never returned.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, directory_url]
              properties:
                name: { type: string }
                kind: { type: string, enum: [acme, vault, stepca], default: acme }
                directory_url: { type: string, format: uri, description: "ACME directory, or the Vault / step-ca base URL (https, no path)" }
                email: { type: string, description: ACME only }
                agree_tos: { type: boolean, description: ACME only; must be true }
                profile: { type: string, description: ACME only }
                ca_bundle: { type: string, description: PEM roots trusted for TLS to a Vault or step-ca server }
                credential: { type: string, writeOnly: true, description: "Vault: AppRole secret_id or token. step-ca: the decrypted provisioner JWK (JSON)." }
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    mount: { type: string, description: Vault PKI mount }
                    role: { type: string, description: Vault PKI role (sign/<role>) }
                    issuer_ref: { type: string, description: Vault issuer to sign with (optional) }
                    namespace: { type: string, description: Vault namespace (optional) }
                    ttl: { type: string, description: "Vault certificate TTL, e.g. 720h (optional)" }
                    auth_method: { type: string, enum: [approle, token] }
                    auth_mount: { type: string, description: Vault AppRole mount (default approle) }
                    role_id: { type: string, description: Vault AppRole role_id }
                    provisioner: { type: string, description: step-ca JWK provisioner name }
                    key_id: { type: string, description: step-ca provisioner key id (default the JWK's kid) }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [renewal]
      summary: Show a issuer (id or name)
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [renewal]
      summary: Change a issuer; absent fields stay as they are
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string }, email: { type: string, description: ACME only }, profile: { type: string, description: ACME only }, ca_bundle: { type: string, description: Vault and step-ca only } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [renewal]
      summary: Delete a issuer nothing else references
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers/{id}/eab:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [renewal]
      summary: Set an issuer's External Account Binding mode (ADR-0019, issuers:manage). The HMAC key is encrypted with the KEK, never returned, and reaches an agent only sealed to it until it has registered an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [none, reusable, single_use] }
                kid: { type: string, description: Key id (mode reusable only) }
                hmac: { type: string, writeOnly: true, description: Base64url HMAC key (mode reusable only; omit to keep the stored one) }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers/{id}/credential:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [renewal]
      summary: Replace the credential of a Vault or step-ca issuer (ADR-0028, issuers:manage). It is encrypted with the KEK and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers/{id}/eab-keys:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [renewal]
      summary: List an issuer's single-use EAB keys and their state (available, claimed, consumed, failed); HMAC keys are never returned
      responses:
        "200": { $ref: "#/components/responses/List" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [renewal]
      summary: Add a single-use EAB key to the issuer's pool (issuers:manage); each key registers one agent's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kid, hmac]
              properties:
                kid: { type: string }
                hmac: { type: string, writeOnly: true }
                expires_at: { type: string, format: date-time }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/issuers/{id}/eab-keys/{key}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: key, in: path, required: true, schema: { type: string } }
    delete:
      tags: [renewal]
      summary: Remove an available or failed single-use key (issuers:manage)
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks:
    get:
      tags: [admin]
      summary: List event webhook endpoints (ADR-0021, webhooks:manage); secrets are never returned
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [admin]
      summary: Register an endpoint for typed events (docs/events.md). The response carries the signing secret (Standard Webhooks, whsec_...) once; it is stored encrypted and never shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, event_types]
              properties:
                name: { type: string }
                url: { type: string, format: uri, description: https; http only with allow_private }
                event_types: { type: array, items: { type: string }, description: "Event types or prefix.* (e.g. renewal.*)" }
                allow_private: { type: boolean, description: Allow private and loopback receivers }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: Show an endpoint (id or name)
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      summary: Delete an endpoint and its delivery log
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}/enable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Enable an endpoint (also after it was disabled for failing)
      responses:
        "204": { description: Enabled }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Disable an endpoint; queued deliveries fail
      responses:
        "204": { description: Disabled }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}/rotate-secret:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Issue a new signing secret (returned once); the previous one also signs for 24 hours
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}/deliveries:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: Recent deliveries to the endpoint with state, attempts, last status and error
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/webhooks/{id}/deliveries/{delivery}/redeliver:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: delivery, in: path, required: true, schema: { type: integer } }
    post:
      tags: [admin]
      summary: Send a delivery again with the same event id (webhook-id)
      responses:
        "202": { description: Queued }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/trust-bundles:
    get:
      tags: [inventory]
      summary: List trust bundles (ADR-0030)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [inventory]
      summary: Plan or apply a trust bundle's anchors and store assignments (trust:manage). Removing anchors is refused while a CA in use chains to them or an assigned store has not confirmed the current version, unless force is set with a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, anchors]
              properties:
                name: { type: string }
                team: { type: string }
                anchors: { type: array, items: { type: string, description: PEM } }
                stores:
                  type: array
                  items: { type: object, required: [agent, store], properties: { agent: { type: string }, store: { type: string } } }
                base_version: { type: integer, description: Current version the plan was made against }
                dry_run: { type: boolean }
                force: { type: boolean }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/trust-bundles/status:
    get:
      tags: [inventory]
      summary: Every assigned trust store with the version it confirmed and its last error
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/trust-bundles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [inventory]
      summary: A bundle (id or name) with its current anchors and stores
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [inventory]
      summary: Delete a bundle no store is assigned to (trust:manage); stores keep their anchors
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/templates:
    get:
      tags: [renewal]
      summary: List certificate templates at their current versions (ADR-0020)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [renewal]
      summary: Apply a certificate template (YAML or JSON body; templates:manage). The plan lists deployments whose issuer or challenge changes, which need a new approval, and which would break the template; apply is refused while any would break it.
      parameters:
        - { name: dry_run, in: query, description: Validate and show the plan without applying, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/yaml: { schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/templates/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [renewal]
      summary: Show a template (id or name) with its current document and source
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [renewal]
      summary: Delete a template no deployment uses (templates:manage)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/dns-solvers:
    get:
      tags: [renewal]
      summary: List central DNS-01 solvers (ADR-0018). Secrets are never returned; has_secret says whether one is stored.
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [renewal]
      summary: Define a central DNS-01 solver (dns:manage). A stored secret is encrypted with the KEK and reaches agents only sealed to them inside issue tasks.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, zones]
              properties:
                name: { type: string }
                provider: { type: string, enum: [rfc2136, cloudflare, plugin] }
                plugin: { type: string, description: Absolute path of the plugin on the agent hosts (provider plugin) }
                plugin_sha256: { type: string, description: Hex SHA-256 the plugin must match }
                zones: { type: array, items: { type: string } }
                config: { type: object, additionalProperties: true, description: "Non-secret settings: rfc2136 needs nameserver (host:port); cloudflare may set api_url" }
                credential: { type: string, enum: [stored, ambient], default: stored, description: ambient uses the host's cloud identity (plugins only) }
                secret: { type: object, additionalProperties: { type: string }, writeOnly: true, description: "rfc2136 {tsig_key: BIND key block}, cloudflare {api_token}, plugins as documented" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/dns-solvers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [renewal]
      summary: Show a central DNS-01 solver (without its secret)
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [renewal]
      summary: Delete a central DNS-01 solver and its stored secret (dns:manage)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/dns-solvers/{id}/secret:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [renewal]
      summary: Replace (rotate) a stored secret (dns:manage); the next issuance uses it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: object, additionalProperties: { type: string }, writeOnly: true }
      responses:
        "204": { description: Replaced }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/dns-solvers/{id}/agents/{agent}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: agent, in: path, required: true, schema: { type: string } }
    put:
      tags: [renewal]
      summary: Assign a solver to an agent (dns:manage)
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [renewal]
      summary: Remove a solver from an agent (dns:manage)
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/authorities:
    get:
      tags: [inventory]
      summary: List CA authorities (subject + key; cross-signed copies grouped), soonest effective expiry first
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [root, intermediate] } }
        - { name: in_use, in: query, description: Only authorities above a lineage's current certificate or a served leaf, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/authorities/plan:
    get:
      tags: [inventory]
      summary: Authorities in use whose effective expiry falls within the window, with impact counts and the renew-by date
      parameters:
        - { name: within, in: query, description: "Window such as 365d or 2160h (default 365d)", schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/authorities/{key}:
    get:
      tags: [inventory]
      summary: An authority (key or unique prefix of 8+ characters) and everything that chains through it
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/authorities/{key}/renew-affected:
    post:
      tags: [renewal]
      summary: Start renewal runs (renewals:run) for deployments whose certificate chains through the authority and outlives the chain, or all of them; approvals and windows apply per run
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean }
                dry_run: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "202": { $ref: "#/components/responses/Object" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/deployments:
    get:
      tags: [renewal]
      summary: List deployments (lineage -> agent target -> issuer)
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [renewal]
      summary: Create a deployment (deployments:manage), or request one (deployments:request). SANs must be in the target's allowed_sans. Without deployments:manage, or when policy approvals.deployments is required, it stays pending until someone else approves it.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineage, agent, target, sans]
              properties:
                lineage: { type: string }
                agent: { type: string }
                target: { type: string }
                issuer: { type: string, description: Issuer id or name; required unless a template supplies it }
                endpoint: { type: string, description: Endpoint id for external verification }
                sans: { type: array, items: { type: string } }
                maintenance_window: { type: string, description: "Weekly window for activation, e.g. \"Mon-Fri 02:00-05:00 Europe/Athens\"" }
                window_emergency: { type: string, enum: [block, renew_outside_window], description: What to do when no window is left before the safety deadline }
                challenge: { type: string, enum: [http-01, dns-01], default: http-01, description: How domain control is proven. dns-01 uses the agent's dns_solvers and is required for wildcard SANs. Part of the approved spec. }
                template: { type: string, description: "Certificate template (ADR-0020). It fixes the issuer and challenge, supplies the default key algorithm and maintenance window, and checks the names. Required when policy templates.required is set." }
                key_algorithm: { type: string, enum: [ecdsa-p256], description: Must be allowed by the template when one is used }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/deployments/{id}/renew:
    post:
      tags: [renewal]
      summary: Start a renewal run now (409 if one is active)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/deployments/{id}/window:
    put:
      tags: [renewal]
      summary: Set or clear (empty string) the maintenance window; waiting or blocked runs are re-evaluated
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maintenance_window]
              properties:
                maintenance_window: { type: string }
                window_emergency: { type: string, enum: [block, renew_outside_window] }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/deployments/{id}/request-approval:
    post:
      tags: [approvals]
      summary: Request approval for a deployment whose approval does not cover its current spec (denied, revoked, expired, changed, or created before approvals were required)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/deployments/{id}/revoke-approval:
    post:
      tags: [approvals]
      summary: Revoke a deployment's approval (approvals:decide); runs stop before changing the target
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/exceptions:
    get:
      tags: [approvals]
      summary: Policy exceptions, newest first
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [requested, active, denied, expired, revoked] } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      tags: [approvals]
      summary: Request a time-bound exception for one open finding (one condition on one subject, accepted at its current severity); it needs someone else's approval and is refused for checks in policy exceptions.prohibitedChecks
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, check, rationale, risk_owner, expires_at]
              properties:
                subject_type: { type: string, enum: [certificate, endpoint, lineage] }
                subject_id: { type: string }
                check: { type: string }
                rationale: { type: string, maxLength: 2000 }
                compensating_controls: { type: string, maxLength: 2000 }
                risk_owner: { type: string, maxLength: 200, description: Person accountable for the accepted risk }
                remediation_owner: { type: string, maxLength: 200 }
                remediation_due: { type: string, format: date }
                tracking_ref: { type: string, maxLength: 200, description: Ticket or change reference for the fix }
                expires_at: { type: string, format: date-time, description: "At most policy exceptions.maxDuration (default 90d) from now" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/exceptions/{id}:
    get:
      tags: [approvals]
      summary: One policy exception
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/exceptions/{id}/revoke:
    post:
      tags: [approvals]
      summary: End an exception early (approvals:decide); its alerts open again
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: Approval requests, newest first
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [requested, approved, denied, expired, revoked] } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}:
    get:
      tags: [approvals]
      summary: One approval request, with the exact spec it covers
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [approvals]
      summary: Approve a request (signed-in people only; never the requester or the creator of the requesting token)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}/deny:
    post:
      tags: [approvals]
      summary: Deny a request; a reason is required
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/runs:
    get:
      tags: [renewal]
      summary: Recent renewal runs
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/runs/{id}:
    get:
      tags: [renewal]
      summary: A run with its step timeline
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/cancel:
    post:
      tags: [renewal]
      summary: Cancel a run that has not yet changed the target
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Cancelled }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/policy:
    get:
      tags: [admin]
      summary: The active monitoring policy (defaults if none applied)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      tags: [admin]
      summary: Apply a new policy version (YAML or JSON body)
      parameters:
        - { name: dry_run, in: query, description: Validate and show impact without applying, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/yaml: { schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit:
    get:
      tags: [audit]
      summary: Audit events in sequence order
      parameters:
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        "200": { $ref: "#/components/responses/List" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit/verify:
    get:
      tags: [audit]
      summary: Recompute the in-database hash chain (internal consistency only)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/audit/export-status:
    get:
      tags: [audit]
      summary: External audit export progress per sink
      responses:
        "200": { $ref: "#/components/responses/List" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      description: ETag from a previous GET, e.g. "v3"
      schema: { type: string }
  schemas:
    Role:
      type: string
      enum: [owner, operator, viewer, auditor]
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        remediation: { type: string }
        request_id: { type: string }
    Certificate:
      type: object
      properties:
        sha256: { type: string }
        serial: { type: string }
        subject: { type: string }
        issuer: { type: string }
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        ip_addresses: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { type: string }
        key_bits: { type: integer }
        signature_algorithm: { type: string }
        is_ca: { type: boolean }
        self_signed: { type: boolean }
        source: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Status:
      description: Status
      content:
        application/json:
          schema: { type: object }
    Object:
      description: Resource
      content:
        application/json:
          schema: { type: object }
    Versioned:
      description: Resource with an ETag header for If-Match
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { type: object }
    List:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { type: object } }
              next_cursor: { type: string }
