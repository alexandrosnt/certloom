name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: certloom_owner
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: certloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certloom_owner" --health-interval 2s --health-retries 30
    env:
      CERTLOOM_TEST_DATABASE_URL: postgres://certloom_owner:ci-only-not-secret@127.0.0.1:5432/certloom?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit + database tests (race)
        run: go test -race -count=1 $(go list ./... | grep -v /test/e2e)
      - name: Go client module (vet, unit tests)
        working-directory: client
        run: go vet ./... && go test -race -count=1 ./...
      - name: certloom-plugin module (vet, unit tests)
        working-directory: cmd/certloom-plugin
        run: go vet ./... && go test -race -count=1 ./...
      # Real nginx container, real binaries, OIDC against a test IdP, backup/restore
      # drill and secret scans of the DB dump and server logs.
      - name: end-to-end
        run: go test -count=1 -v ./test/e2e/
      # Full renewal: real Pebble ACME + HTTP-01 + Nginx + certloom-agent + certloomd on a
      # private Docker network (self-contained; does not use the service DB). Also
      # installs the certloom-agent .deb on a systemd host and renews through the unit.
      - name: renewal end-to-end (agent, ACME, Nginx, rollback)
        if: matrix.postgres == '18'
        env:
          CERTLOOM_ACME_E2E: "1"
        run: go test -count=1 -v -timeout 20m ./test/acme/
      # kind cluster with cert-manager; the agent observes it with the RBAC from
      # deploy/kubernetes/agent.yaml.
      - name: Kubernetes observation end-to-end (kind, cert-manager)
        if: matrix.postgres == '18'
        env:
          CERTLOOM_KUBE_E2E: "1"
        run: go test -count=1 -v -timeout 20m ./test/kube/
      - name: scale (10k certificates, 2k endpoints; records numbers)
        if: matrix.postgres == '18'
        env:
          CERTLOOM_SCALE: "1"
        run: go test -count=1 -v -timeout 30m ./test/scale/
      - name: build
        run: go build ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz certificate parser (10 min)
        run: go test ./internal/certparse -run '^$' -fuzz FuzzParse -fuzztime 10m

  # Windows agent (ADR-0022): CNG machine keys, HTTP.sys and a real IIS site.
  # Hosted runners are elevated, which HTTP.sys configuration needs.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install IIS
        shell: pwsh
        run: Install-WindowsFeature -Name Web-Server, Web-Static-Content
      - name: agent and Windows API tests (elevated), IIS end to end
        env:
          CERTLOOM_IIS_E2E: "1"
        run: go test -v ./internal/winapi/ ./internal/agent/ ./cmd/certloom-agent/
      - name: lint for Windows
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: lint Go client module
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: client
      - name: lint certloom-plugin module
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: cmd/certloom-plugin

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: govulncheck certloom-plugin module
        working-directory: cmd/certloom-plugin
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: dependency licenses (no GPL/AGPL; MPL needs a NOTICE entry first)
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check ./...
          --ignore github.com/alexandrosnt/certloom
          --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"   # first push of a branch: check its whole history
          else
            range="$BASE..$HEAD"
          fi
          missing=0
          for c in $(git rev-list --no-merges "$range"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s' (see CONTRIBUTING.md)."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check release config
        run: docker run --rm -v "$PWD:/src" -w /src goreleaser/goreleaser:v2.20.0 check
      - name: build archives, packages and images (unsigned snapshot)
        run: IMAGES=1 sh deploy/packaging/build.sh
      - name: offline bundle (amd64) from the snapshot images
        run: |
          v=$(jq -r .version dist/metadata.json)
          IMAGE_SOURCE=docker-daemon:ghcr.io/alexandrosnt IMAGE_TAG="$v-amd64" \
            sh deploy/release/offline-bundle.sh "$v" amd64 dist dist-offline
          mkdir x && tar xzf dist-offline/*.tar.gz -C x
          (cd x/* && sha256sum -c --quiet CONTENTS.sha256)
          docker load -i x/*/images/certloom.tar
          docker run --rm "certloom:$v" version
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm

  # The same commit must give the same bytes on different runner images
  # (ADR-0031). Unsigned snapshots: signatures carry a timestamp.
  reproducible:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build
        run: VERSION=0.0.0-repro sh deploy/packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.os }}
          path: dist/SHA256SUMS

  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
      - name: compare
        run: diff sums-ubuntu-24.04/SHA256SUMS sums-ubuntu-22.04/SHA256SUMS

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build container image
        run: docker build -t certloom:ci . && docker build -f Dockerfile.agent -t certloom-agent:ci .
