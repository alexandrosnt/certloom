name: release-build

# Called by release.yml only. Builds, signs and attests every release file
# and image, then publishes the deb and rpm packages to the apt/yum repo.
#
# Environment "release" (owner approval) holds the secrets:
#   PACKAGE_GPG_KEY         armored secret packaging key
#   PACKAGE_GPG_PASSPHRASE  its passphrase
#   PACKAGES_DEPLOY_KEY     SSH deploy key with write access to certloom-packages only
on:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: release notes
        run: deploy/release/notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # The guide applies the manifest from the tag, so it must name the
      # image this release pushes.
      - name: Kubernetes manifest names this release
        run: |
          grep -qF "image: ghcr.io/alexandrosnt/certloom-agent:${GITHUB_REF_NAME#v}" deploy/kubernetes/agent.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0

      - name: packaging key
        env:
          PACKAGE_GPG_KEY: ${{ secrets.PACKAGE_GPG_KEY }}
        run: |
          umask 077
          printf '%s\n' "$PACKAGE_GPG_KEY" > "$RUNNER_TEMP/package-key.asc"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          PACKAGE_GPG_KEY_FILE: ${{ runner.temp }}/package-key.asc
          NFPM_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}

      - name: image digests
        id: images
        run: |
          v=${GITHUB_REF_NAME#v}
          for img in certloom certloom-agent; do
            d=$(docker buildx imagetools inspect "ghcr.io/alexandrosnt/$img:$v" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "${img//-/_}=$d" >> "$GITHUB_OUTPUT"
          done

      - name: provenance for release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: provenance for the certloom image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexandrosnt/certloom
          subject-digest: ${{ steps.images.outputs.certloom }}
          push-to-registry: true
      - name: provenance for the certloom-agent image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexandrosnt/certloom-agent
          subject-digest: ${{ steps.images.outputs.certloom_agent }}
          push-to-registry: true

      - name: public packaging key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --quiet --import "$RUNNER_TEMP/package-key.asc"
          gpg --batch --armor --export > dist/gpg.key
          rm -rf "$GNUPGHOME"

      # ADR-0032: one offline bundle per architecture, signed and attested
      # like the other release files.
      - name: offline bundles
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for arch in amd64 arm64; do
            deploy/release/offline-bundle.sh "$GITHUB_REF_NAME" "$arch" dist dist-offline
          done
          cd dist-offline
          sha256sum -- *.tar.gz > SHA256SUMS-offline
          cosign sign-blob --yes --bundle SHA256SUMS-offline.sigstore.json SHA256SUMS-offline
      - name: provenance for offline bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-offline/SHA256SUMS-offline
      - name: upload offline bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-offline/* dist/gpg.key --clobber

      - name: remove packaging key
        if: always()
        run: rm -f "$RUNNER_TEMP/package-key.asc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  repo:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: certloom
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexandrosnt/certloom-packages
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: tools
        run: sudo apt-get install -y -qq apt-utils createrepo-c
      - name: publish
        env:
          PACKAGE_GPG_KEY: ${{ secrets.PACKAGE_GPG_KEY }}
          PACKAGE_GPG_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}
        run: |
          umask 077
          printf '%s\n' "$PACKAGE_GPG_KEY" > "$RUNNER_TEMP/package-key.asc"
          umask 022
          PACKAGE_GPG_KEY_FILE="$RUNNER_TEMP/package-key.asc" \
            certloom/deploy/packaging/publish-repo.sh packages repo
          rm -f "$RUNNER_TEMP/package-key.asc"
      - name: push
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Add certloom $GITHUB_REF_NAME packages"
          git push -q
